<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Zeh Motoca - Relatório de Estoque</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eceff1; padding: 20px; margin: 0; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #2c3e50; margin-top: 0; text-align: center; }
    textarea { width: 100%; height: 350px; font-family: monospace; font-size: 13px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; resize: none; background: #f8f9fa; box-sizing: border-box; }
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
    .btn-gerar { background: #007bff; } .btn-gerar:hover { background: #0056b3; }
    .btn-copiar { background: #25D366; } .btn-copiar:hover { background: #1ebc57; }
    .status { text-align: center; margin-top: 10px; font-weight: bold; color: #2e7d32; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🏍️ Zeh Motoca-JP - Relatório WhatsApp</h2>
    <textarea id="relatorioTxt" readonly placeholder="Clique em 'Gerar Relatório' para processar o estoque..."></textarea>
    
    <div class="btn-group">
      <button class="btn-gerar" onclick="gerarRelatorio()">🔄 Atualizar Relatório</button>
      <button class="btn-copiar" onclick="copiarTexto()">📋 Copiar para WhatsApp</button>
    </div>
    <div id="statusMsg" class="status"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
